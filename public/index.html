<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Coffee Demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        .room-empty { background-color: #d1e7dd !important; border-color: #badbcc !important; cursor: pointer; transition: 0.2s; }
        .room-empty:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .room-busy { background-color: #f8d7da !important; border-color: #f5c2c7 !important; cursor: pointer; transition: 0.2s; }
        .room-busy:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        
        @media print {
            body * { visibility: hidden; }
            #printable-bill, #printable-bill * { visibility: visible; }
            #printable-bill { position: absolute; left: 0; top: 0; width: 80mm; font-family: monospace; font-size: 12px; padding: 5px; }
        }
    </style>
</head>
<body class="bg-light">
    <!-- Giao diện trang chủ (giữ nguyên cấu trúc cũ) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3 py-2 shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold d-flex align-items-center" href="#"><span id="brand-name">Karaoke CALI</span></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse justify-content-between" id="navbarNav">
                <ul class="navbar-nav mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link active" href="#" onclick="switchTab('rooms')">Danh sách Bàn</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" onclick="switchTab('menu-price')">Bảng Giá Thực Đơn</a></li>
                    <li class="nav-item"><a class="nav-link position-relative" href="#" onclick="switchTab('online-order')">🛒 Đặt Hàng Online</a></li>
                </ul>
                <div class="d-flex align-items-center">
                    <span class="text-light me-3 small d-none d-md-inline" id="user-info-display"></span>
                    <a href="admin.html" class="btn btn-outline-light btn-sm me-2" id="admin-nav" style="display:none;">Quản Trị</a>
                    <button class="btn btn-outline-warning btn-sm me-2" id="login-btn" onclick="openLoginModal()">Đăng Nhập</button>
                    <button class="btn btn-outline-danger btn-sm" id="logout-btn" style="display:none;" onclick="logout()">Đăng Xuất</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Các Tab và Modal giao diện giữ nguyên theo mã nguồn gốc của bạn -->
    <div class="container my-4" id="tab-rooms">
        <div class="d-flex justify-content-between align-items-md-center mb-4 gap-2">
            <h3 id="facility-title" class="fw-bold fs-4">Sơ Đồ Bàn</h3>
        </div>
        <div class="row" id="room-container"></div>
    </div>

    <!-- Các Modal (bỏ qua mô tả chi tiết HTML để tập trung vào phần script xử lý âm thanh tiếng Việt) -->
    <div class="modal fade" id="bookModal" tabindex="-1">...</div>
    <div class="modal fade" id="activeRoomModal" tabindex="-1">...</div>
    <div class="modal fade" id="billModal" tabindex="-1">...</div>
    <div class="modal fade" id="loginModal" tabindex="-1">...</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let cart = [];
        let currentCheckoutRoomId = null;
        const socket = io();

        // Hàm phát âm thanh Tiếng Việt với tốc độ chậm (tương đương khoảng nghỉ nhịp nhàng)
        function speakVietnamese(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'vi-VN'; // Đặt chuẩn tiếng Việt
                utterance.rate = 0.75;    // Chỉnh tốc độ chậm để vừa vặn nhịp ngắt quãng
                window.speechSynthesis.speak(utterance);
            }
        }

        // Chuyển đổi mọi số bàn sang chữ Tiếng Việt đầy đủ (Ví dụ: 1->một, 15->mười lăm, 20->hai mươi)
        function numberToVietnameseWords(num) {
            const units = ["", "một", "hai", "ba", "bốn", "năm", "sáu", "bảy", "tám", "chín"];
            if (num < 10) return units[num];
            if (num === 10) return "mười";
            if (num < 20) return "mười " + units[num % 10];
            const ten = Math.floor(num / 10);
            const unit = num % 10;
            if (unit === 0) return units[ten] + " mươi";
            if (unit === 5) return units[ten] + " mươi lăm";
            return units[ten] + " mươi " + units[unit];
        }

        // Tự động phân tích tên bàn (bất kể định dạng: "Bàn 01", "Bàn 12", "VIP 3"...) ra dạng phát âm "bàn [tên tiếng việt]"
        function getTableNameVietnamese(roomName) {
            const matches = roomName.match(/\d+/g);
            if (!matches) return roomName.toLowerCase();
            const num = parseInt(matches[matches.length - 1], 10);
            return `bàn ${numberToVietnameseWords(num)}`;
        }

        // LẮNG NGHE SỰ KIỆN REALTIME ĐỂ PHÁT ÂM THANH TRÊN TẤT CẢ CÁC MÁY
        socket.on('order_added', (data) => {
            const tableNameVi = getTableNameVietnamese(data.roomName); // Ví dụ: "bàn một", "bàn hai"...
            speakVietnamese(tableNameVi);
            loadRooms();
        });

        socket.on('online_order_new', () => {
            speakVietnamese("có đơn hàng online");
        });

        socket.on('room_paid', (data) => {
            const tableNameVi = getTableNameVietnamese(data.roomName); // Ví dụ: "đã thanh toán bàn một"
            speakVietnamese(`đã thanh toán ${tableNameVi}`);
            loadRooms();
        });

        async function init() {
            const resSet = await fetch('/api/settings');
            const settings = await resSet.json();
            if(settings.name) {
                document.getElementById('brand-name').innerText = settings.name;
                document.getElementById('page-title').innerText = settings.name;
                document.getElementById('facility-title').innerText = `Sơ Đồ Bàn - ${settings.name}`;
            }
            loadRooms();
        }

        async function loadRooms() {
            const res = await fetch('/api/rooms');
            const rooms = await res.json();
            document.getElementById('room-container').innerHTML = rooms.map(room => {
                const isBusy = room.status !== 'Trống';
                return `
                    <div class="col-xl-3 col-lg-4 col-md-6 mb-3">
                        <div class="card ${isBusy ? 'room-busy' : 'room-empty'} p-3 shadow-sm border" onclick='openRoomAction(${JSON.stringify(room)})'>
                            <h5 class="fw-bold">${room.room_name}</h5>
                            <p class="mb-0"><strong>Trạng thái:</strong> ${room.status}</p>
                            ${isBusy ? `<small class="text-danger mt-1"><b>${room.customer_name}</b></small>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openRoomAction(room) {
            if(room.status === 'Trống') {
                document.getElementById('b-room-id').value = room.id;
                document.getElementById('b-room-name').innerText = room.room_name;
                document.getElementById('c-name').value = `Khách ${room.room_name}`;
                new bootstrap.Modal(document.getElementById('bookModal')).show();
            } else {
                document.getElementById('a-room-id').value = room.id;
                document.getElementById('a-room-name').innerText = room.room_name;
                document.getElementById('a-customer').innerText = room.customer_name;
                loadOrders(room.id);
                new bootstrap.Modal(document.getElementById('activeRoomModal')).show();
            }
        }

        async function loadOrders(roomId) {
            const res = await fetch(`/api/orders/${roomId}`);
            const orders = await res.json();
            // ... (Hiển thị danh sách món gọi)
        }

        async function addOrder() {
            const room_id = document.getElementById('a-room-id').value;
            const item_id = document.getElementById('menu-select').value;
            const quantity = document.getElementById('menu-qty').value;
            // Gửi dữ liệu lên server, server sẽ tự broadcast sự kiện order_added ra toàn bộ thiết bị
            await fetch('/api/orders', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ room_id, item_id, quantity }) });
            loadOrders(room_id);
        }

        async function confirmPaidAndClose() {
            if (!currentCheckoutRoomId) return;
            const payment_method = document.querySelector('input[name="paymentMethod"]:checked') ? document.querySelector('input[name="paymentMethod"]:checked').value : 'Tiền mặt';

            const res = await fetch('/api/rooms/confirm-paid', { 
                method: 'POST', 
                headers: {'Content-Type': 'application/json'}, 
                body: JSON.stringify({ room_id: currentCheckoutRoomId, payment_method }) 
            });
            const data = await res.json();
            if(data.success) {
                alert('Đã xác nhận thanh toán thành công!');
                location.reload();
            }
        }

        init();
    </script>
</body>
</html>
